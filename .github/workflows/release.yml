
name: Java CI with Gradle (release)

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  LOGSTASH_VERSION: v8.19.21

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        path: logstash-input-grpc

    - name: Checkout Logstash
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        path: logstash
        repository: elastic/logstash
        ref: ${{ env.LOGSTASH_VERSION }}

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Build logstash-core
      working-directory: logstash
      run: ./gradlew assemble

    - name: Build gem
      working-directory: logstash-input-grpc
      run: ./gradlew gem -PLOGSTASH_CORE_PATH=${{ github.workspace }}/logstash/logstash-core

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        prerelease: true
        files: |
          logstash-input-grpc/logstash-input-grpc-*.gem
